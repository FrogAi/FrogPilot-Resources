<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">Alfa Romeo</title>
  <desc id="icon-desc">
    FrogPilot (driver-assistance software for cars) car icon: the round Alfa Romeo badge as its 2015 brand guidelines draw it for very small sizes, in the guidelines&apos; flat colours, with ALFA ROMEO in light grey on a navy ring and the red cross of Milan beside the crowned green serpent on a plain grey field, without the 3D shading and pyramid texture.
  </desc>
